<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ نظام إدارة الطاولات - مطعم تعلولة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🎯 الشريط العلوي -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <header class="main-header">
        <div class="header-content">
            <h1>🍽️ مطعم تعلولة</h1>
            <p class="subtitle">نظام إدارة الطاولات الذكي</p>
        </div>
        <div class="header-stats">
            <div class="stat-card available">
                <i class="fas fa-check-circle"></i>
                <span id="availableCount">0</span>
                <small>متاحة</small>
            </div>
            <div class="stat-card occupied">
                <i class="fas fa-users"></i>
                <span id="occupiedCount">0</span>
                <small>مشغولة</small>
            </div>
            <div class="stat-card total">
                <i class="fas fa-chair"></i>
                <span id="totalCount">0</span>
                <small>إجمالي</small>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🔍 شريط البحث والأدوات -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن طاولة...">
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">
                <i class="fas fa-th"></i> الكل
            </button>
            <button class="filter-btn" data-filter="available">
                <i class="fas fa-check"></i> متاحة
            </button>
            <button class="filter-btn" data-filter="occupied">
                <i class="fas fa-users"></i> مشغولة
            </button>
        </div>
        <button class="refresh-btn" id="refreshBtn">
            <i class="fas fa-sync-alt"></i> تحديث
        </button>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🪑 شبكة الطاولات -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <main class="tables-container">
        <div class="tables-grid" id="tablesGrid">
            <!-- يتم ملء الطاولات ديناميكياً من JavaScript -->
        </div>
    </main>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🔔 نظام الإشعارات -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🪟 نافذة تأكيد التفريغ -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-question-circle"></i>
                <h3 id="modalTitle">تأكيد العملية</h3>
            </div>
            <div class="modal-body">
                <p id="modalMessage">هل أنت متأكد؟</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="modalCancelBtn">إلغاء</button>
                <button class="btn btn-confirm" id="modalConfirmBtn">تأكيد</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 📝 نافذة تفاصيل الطاولة -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="modal-overlay" id="tableDetailsModal">
        <div class="modal-content large">
            <div class="modal-header">
                <i class="fas fa-info-circle"></i>
                <h3>تفاصيل الطاولة</h3>
                <button class="close-btn" id="closeDetailsBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="tableDetailsBody">
                <!-- يتم ملؤه ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 📱 الشريط السفلي -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <footer class="main-footer">
        <p>© 2026 مطعم تعلولة - جميع الحقوق محفوظة</p>
        <p class="version">الإصدار 2.0 | نظام إدارة الطاولات الذكي</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- الملف الرئيسي -->
    <script src="script.js"></script>
</body>
</html>
