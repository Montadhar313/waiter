<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#B71C1C">
    <title>🍽️ مطعم تعلولة - نظام الطاولات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🎯 الشريط العلوي المصغّر -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <header class="compact-header">
        <div class="header-row">
            <div class="header-brand">
                <div class="brand-icon">🍽️</div>
                <div class="brand-text">
                    <h1>تعلولة</h1>
                    <span class="brand-sub">نظام الطاولات</span>
                </div>
            </div>
            <div id="connectionStatus" class="conn-badge disconnected">
                <span class="conn-dot"></span>
                <span id="connectionText">...</span>
            </div>
        </div>
        <div class="mini-stats">
            <div class="mini-stat available">
                <i class="fas fa-check-circle"></i>
                <span id="availableCount">0</span>
            </div>
            <div class="mini-stat occupied">
                <i class="fas fa-users"></i>
                <span id="occupiedCount">0</span>
            </div>
            <div class="mini-stat total">
                <i class="fas fa-chair"></i>
                <span id="totalCount">0</span>
            </div>
            <div class="mini-stat freed">
                <i class="fas fa-door-open"></i>
                <span id="freedCount">0</span>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 📱 المحتوى الرئيسي -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <main class="app-content">
        
        <!-- ═══════════════════════════════════════════════════════ -->
        <!-- 📷 ماسح QR الاحترافي -->
        <!-- ═══════════════════════════════════════════════════════ -->
        <section class="scanner-section">
            <div class="scanner-pro-card">
                <div class="scanner-pro-header">
                    <div class="scanner-icon-wrap">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div class="scanner-header-text">
                        <h2>مسح رمز الطاولة</h2>
                        <p>وجّه الكاميرا لرمز QR لتفريغ الطاولة</p>
                    </div>
                </div>
                
                <div class="scanner-viewfinder" id="scannerContainer">
                    <div id="reader"></div>
                    <div class="scanner-frame-pro" id="scannerOverlay" style="display:none;">
                        <div class="frame-corner top-right"></div>
                        <div class="frame-corner top-left"></div>
                        <div class="frame-corner bottom-right"></div>
                        <div class="frame-corner bottom-left"></div>
                        <div class="scan-beam"></div>
                        <div class="frame-label">📷 وجّه الرمز داخل الإطار</div>
                    </div>
                    <div class="scanner-idle" id="scannerPlaceholder">
                        <div class="idle-camera">
                            <i class="fas fa-camera"></i>
                            <div class="camera-pulse"></div>
                        </div>
                        <p class="idle-text">الكاميرا جاهزة</p>
                    </div>
                </div>

                <div class="scanner-controls">
                    <button class="ctrl-btn start-btn" id="startScanBtn" onclick="startScanner()">
                        <i class="fas fa-play-circle"></i>
                        <span>تشغيل</span>
                    </button>
                    <button class="ctrl-btn stop-btn" id="stopScanBtn" onclick="stopScanner()" style="display:none;">
                        <i class="fas fa-stop-circle"></i>
                        <span>إيقاف</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ═══════════════════════════════════════════════════════ -->
        <!-- ⌨️ الإدخال اليدوي -->
        <!-- ═══════════════════════════════════════════════════════ -->
        <section class="manual-section">
            <div class="manual-card">
                <label class="manual-label">
                    <i class="fas fa-keyboard"></i>
                    تفريغ يدوي
                </label>
                <div class="manual-row">
                    <input type="number" class="manual-field" id="manualTableInput" 
                           placeholder="رقم الطاولة" min="1" inputmode="numeric">
                    <button class="manual-submit" onclick="manualFreeTable()">
                        <i class="fas fa-door-open"></i>
                        <span>تفريغ</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ═══════════════════════════════════════════════════════ -->
        <!-- 🎯 نتيجة العملية -->
        <!-- ═══════════════════════════════════════════════════════ -->
        <div class="result-card" id="resultCard">
            <div class="result-icon" id="resultIcon">✅</div>
            <div class="result-title" id="resultTitle">تم بنجاح!</div>
            <div class="result-message" id="resultMessage">تم تفريغ الطاولة بنجاح</div>
            <div class="result-table-number" id="resultTableNumber" style="display:none;"></div>
            <div class="result-time" id="resultTime"></div>
        </div>

        <!-- ═══════════════════════════════════════════════════════ -->
        <!-- 🔍 شريط الأدوات -->
        <!-- ═══════════════════════════════════════════════════════ -->
        <div class="toolbar-pro">
            <div class="search-pro">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث عن طاولة...">
            </div>
            <div class="filters-pro">
                <button class="filter-chip active" data-filter="all">
                    <i class="fas fa-th"></i> الكل
                </button>
                <button class="filter-chip" data-filter="available">
                    <i class="fas fa-check"></i> متاحة
                </button>
                <button class="filter-chip" data-filter="occupied">
                    <i class="fas fa-users"></i> مشغولة
                </button>
            </div>
            <button class="refresh-pro" id="refreshBtn">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- ═══════════════════════════════════════════════════════ -->
        <!-- 🪑 شبكة الطاولات -->
        <!-- ═══════════════════════════════════════════════════════ -->
        <div class="tables-grid-pro" id="tablesGrid">
            <!-- يتم ملء الطاولات ديناميكياً -->
        </div>

        <!-- ═══════════════════════════════════════════════════════ -->
        <!-- 📋 سجل التفريغ -->
        <!-- ═══════════════════════════════════════════════════════ -->
        <section class="history-section">
            <div class="history-card-pro">
                <div class="history-header">
                    <i class="fas fa-clipboard-list"></i>
                    <span>سجل التفريغ</span>
                    <span class="history-count" id="historyCount">0</span>
                </div>
                <ul class="history-list-pro" id="historyList">
                    <li class="history-empty">
                        <i class="fas fa-inbox"></i>
                        <p>لم يتم تفريغ أي طاولة بعد</p>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- 🔔 الإشعارات -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- 🍞 Toast -->
    <div class="toast-pro" id="toast">
        <span id="toastIcon">ℹ️</span>
        <span id="toastMessage"></span>
    </div>

    <!-- 🪟 نوافذ التأكيد -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-pro">
            <div class="modal-header-pro">
                <div class="modal-icon"><i class="fas fa-question-circle"></i></div>
                <h3 id="modalTitle">تأكيد العملية</h3>
            </div>
            <div class="modal-body-pro">
                <p id="modalMessage">هل أنت متأكد؟</p>
            </div>
            <div class="modal-footer-pro">
                <button class="modal-btn cancel" id="modalCancelBtn">إلغاء</button>
                <button class="modal-btn confirm" id="modalConfirmBtn">
                    <i class="fas fa-check"></i> تأكيد
                </button>
            </div>
        </div>
    </div>

    <!-- 📝 تفاصيل الطاولة -->
    <div class="modal-overlay" id="tableDetailsModal">
        <div class="modal-pro large">
            <div class="modal-header-pro">
                <div class="modal-icon"><i class="fas fa-info-circle"></i></div>
                <h3>تفاصيل الطاولة</h3>
                <button class="close-modal" id="closeDetailsBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body-pro" id="tableDetailsBody"></div>
            <div class="modal-footer-pro">
                <button class="modal-btn cancel" id="closeDetailsBtn2">إغلاق</button>
                <button class="modal-btn confirm" id="freeFromDetailsBtn" style="display:none;">
                    <i class="fas fa-door-open"></i> تفريغ
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
